<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHMAI-NetRG</title>
    <link rel="stylesheet" href="css/rg.css" />
    <!-- Add this line -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Add this line -->
    <link rel="icon" href="images/rglogo2.jpg" type="image/png" />
  </head>

  <body>
    <div id="tabs">
      <div class="sidebar-logo">
        <img
          src="images/rg_logo.png"
          alt="Sidebar Logo"
          onclick="openTab(event, 'homepage')"
          style="cursor: pointer"
        />
      </div>
      <button class="tablinks active" onclick="openTab(event, 'homepage')">
        Home
      </button>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          document.getElementById("homepage").style.display = "block";
        });
      </script>
      <button class="tablinks" onclick="openTab(event, 'ListPub')">
        List of Publications
      </button>
      <button class="tablinks" onclick="openTab(event, 'WorkinProg')">
        Works in Progress
      </button>
      <button class="tablinks" onclick="openTab(event, 'AboutPage')">
        Research Activities
      </button>
    </div>
    <div id="mobile-navbar">
      <div class="sidebar-logo">
        <a href="https://dhmairg.net"
          ><img src="images/rg_logo.png" alt="Sidebar Logo"
        /></a>
      </div>
      <div id="hamburger" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </div>
    </div>
    <br /><br /><br />

    <div id="homepage" class="tabcontent active"></div>
    <div id="ListPub" class="tabcontent"></div>
    <div id="WorkinProg" class="tabcontent"></div>
    <div id="AboutPage" class="tabcontent"></div>

    <div>
      <div id="DHMAI" class="tabcontent"></div>

      <div id="PA" class="tabcontent"></div>
      <div id="MIO" class="tabcontent"></div>
      <!--<div id="MR" class="tabcontent"></div>-->
      <div id="AS" class="tabcontent"></div>
      <!--<div id="HE" class="tabcontent"></div>-->
      <div id="MAUZ" class="tabcontent"></div>
      <div id="SFI" class="tabcontent"></div>
      <div id="NRA" class="tabcontent"></div>
      <div id="MASUM" class="tabcontent"></div>
      <!--Members below will not be shown on the homepage but on specific projects-->
      <div id="FI" class="tabcontent"></div>
      <div id="MFHD" class="tabcontent"></div>
      <div id="FA" class="tabcontent"></div>
      <div id="MS" class="tabcontent"></div>
    </div>

    <div id="PrevWorks" class="tabcontent">
      <div class="members-page">
        <h2 class="subsection-title">Publications</h2>
        <br />

        <br />
        <div style="text-align: left">
          <a href="https://scholar.google.com/citations?user=M0oP3RMAAAAJ&hl=en"
            >Google Scholar</a
          ><br />
          <a href="https://dblp.org/pid/169/9791.html">DBLP</a><br />
          <a href="https://www.researchgate.net/profile/Hasan-Islam-3"
            >Research Gate</a
          ><br />
        </div>
      </div>
    </div>

    <!-- ongoing project -->
    <div>
      <div id="CCN-IoV" class="tabcontent"></div>
      <div id="PAUMIoT" class="tabcontent"></div>
      <div id="OppNDA" class="tabcontent"></div>
      <div id="PixieGPT" class="tabcontent"></div>
      <div id="STGen" class="tabcontent"></div>
      <div id="PRIoTP" class="tabcontent"></div>
    </div>

    <!-- upcoming project -->
    <div>
      <div id="PRIoTPS" class="tabcontent"></div>
      <div id="FL-ORCH" class="tabcontent"></div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/config.js"></script>
    <script src="js/publicationsPage.js"></script>
    <script src="js/workInProgress.js"></script>
    <script src="js/aboutPage.js"></script>
    <script src="js/projectPages.js"></script>
    <script src="js/upcomingPage.js"></script>
    <script>
      // Initialize when DOM is loaded
      document.addEventListener("DOMContentLoaded", function () {
        homePage();
        allMemberPage();
        publicationsPage();
        workInProgressPage();
        aboutPage();
        allProjectPages();
        allUpcomingProjectPages();

        // Handle initial tab/hash
        let tab = window.location.hash.replace("#", "") || "homepage";
        if (document.getElementById(tab)) {
          openTab(null, tab, false);
        } else { 
          document.getElementById("homepage").style.display = "block";
        }
      });
    </script>
  </body>
</html>
